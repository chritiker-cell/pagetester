on: push
name: Deploy website on push
jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: schule4.itcoach-wehofer.de/clefbuddy/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: schule4.itcoach-wehofer.de/clefbuddy

    - name: Test
      run: npm test
      working-directory: schule4.itcoach-wehofer.de/clefbuddy
      continue-on-error: true

    - name: Type-check
      run: npx tsc --noEmit
      working-directory: schule4.itcoach-wehofer.de/clefbuddy
      continue-on-error: true

    - name: Build
      run: npm run build
      working-directory: schule4.itcoach-wehofer.de/clefbuddy

    - name: Copy build output to deploy location
      run: |
        rm -rf schule4.itcoach-wehofer.de/clefbuddy/src
        rm -rf schule4.itcoach-wehofer.de/clefbuddy/node_modules
        cp -r schule4.itcoach-wehofer.de/clefbuddy/dist/* schule4.itcoach-wehofer.de/clefbuddy/
        rm -rf schule4.itcoach-wehofer.de/clefbuddy/dist

    - name: Deploy schule3
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      continue-on-error: true
      with:
        server: 195.242.102.132
        username: schulprojekt
        password: ${{ secrets.ftp_password }}
        local-dir: schule3.itcoach-wehofer.de/
        server-dir: schule3.itcoach-wehofer.de/
        exclude: |
          **/.git*/**
          **/.claude/**

    - name: Deploy schule4
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      continue-on-error: true
      with:
        server: 195.242.102.132
        username: schulprojekt
        password: ${{ secrets.ftp_password }}
        local-dir: schule4.itcoach-wehofer.de/
        server-dir: schule4.itcoach-wehofer.de/
        exclude: |
          **/.git*/**
          **/.claude/**
          **/node_modules/**

    - name: Deploy schule5
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      continue-on-error: true
      with:
        server: 195.242.102.132
        username: schulprojekt
        password: ${{ secrets.ftp_password }}
        local-dir: schule5.itcoach-wehofer.de/
        server-dir: schule5.itcoach-wehofer.de/
        exclude: |
          **/.git*/**
          **/.claude/**

    - name: Deploy httpdocs
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      continue-on-error: true
      with:
        server: 195.242.102.132
        username: schulprojekt
        password: ${{ secrets.ftp_password }}
        local-dir: httpdocs/
        server-dir: httpdocs/
