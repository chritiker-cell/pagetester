on: push
name: Deploy website on push
jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: schule4.itcoach-wehofer.de/clefbuddy/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: schule4.itcoach-wehofer.de/clefbuddy

    - name: Test
      run: npm test
      working-directory: schule4.itcoach-wehofer.de/clefbuddy
      continue-on-error: true

    - name: Type-check
      run: npx tsc --noEmit
      working-directory: schule4.itcoach-wehofer.de/clefbuddy
      continue-on-error: true

    - name: Build
      run: npm run build
      working-directory: schule4.itcoach-wehofer.de/clefbuddy

    - name: Copy build output to deploy location
      run: |
        rm -rf schule4.itcoach-wehofer.de/clefbuddy/src
        rm -rf schule4.itcoach-wehofer.de/clefbuddy/node_modules
        cp -r schule4.itcoach-wehofer.de/clefbuddy/dist/* schule4.itcoach-wehofer.de/clefbuddy/
        rm -rf schule4.itcoach-wehofer.de/clefbuddy/dist

    - name: Deploy schule3
      # Eigener FTP-Zugang für schule3 (GitHub-Secrets FTP_SCHULE3_*).
      # Kein continue-on-error: scheitert der Upload, zeigt GitHub ein rotes X.
      timeout-minutes: 10
      env:
        FTP_SERVER: ${{ secrets.FTP_SCHULE3_SERVER }}
        FTP_USER: ${{ secrets.FTP_SCHULE3_USER }}
        # Ersatz: ist FTP_SCHULE3_PASSWORD leer, wird ftp_password (gleicher Benutzer schulprojekt) verwendet
        LFTP_PASSWORD: ${{ secrets.FTP_SCHULE3_PASSWORD || secrets.ftp_password }}
      run: |
        sudo apt-get install -y lftp -q
        # Eingaben bereinigen: Leerzeichen/Zeilenumbrüche beim Einfügen ins Secret entfernen,
        # Server-Adresse darf mit oder ohne "ftp://" bzw. abschließendem "/" im Secret stehen
        SERVER="$(printf '%s' "$FTP_SERVER" | tr -d '[:space:]')"; SERVER="${SERVER#ftp://}"; SERVER="${SERVER%/}"
        FTP_USER="$(printf '%s' "$FTP_USER" | tr -d '[:space:]')"
        LFTP_PASSWORD="$(printf '%s' "$LFTP_PASSWORD" | tr -d '\r\n')"; export LFTP_PASSWORD
        # Prüfung ohne Geheimnisse: nur Längen, kein Inhalt
        echo "Prüfung: Server-Länge=${#SERVER} | Benutzer-Länge=${#FTP_USER} | Passwort-Länge=${#LFTP_PASSWORD}"
        if [ "$SERVER" = "195.242.102.132" ]; then echo "Server: öffentliche Adresse OK"; else echo "WARNUNG: Server ist nicht 195.242.102.132"; fi
        if [ "$FTP_USER" = "schulprojekt" ]; then echo "Benutzer: schulprojekt OK"; else echo "Hinweis: Benutzer ist nicht schulprojekt"; fi
        lftp -c "
          set ftp:ssl-allow no;
          set net:timeout 30;
          set net:max-retries 2;
          set net:reconnect-interval-base 5;
          open --env-password -u \"$FTP_USER\" \"ftp://$SERVER\";
          mirror --reverse --delete --verbose \
            --exclude='^\.git' \
            --exclude='^\.claude' \
            --exclude='(^|/)\.ht' \
            schule3.itcoach-wehofer.de/ schule3.itcoach-wehofer.de/
        "

    - name: Deploy schule4
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      continue-on-error: true
      with:
        server: 195.242.102.132
        username: schulprojekt
        password: ${{ secrets.ftp_password }}
        local-dir: schule4.itcoach-wehofer.de/
        server-dir: schule4.itcoach-wehofer.de/
        exclude: |
          **/.git*/**
          **/.claude/**
          **/node_modules/**

    - name: Deploy schule5
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      continue-on-error: true
      with:
        server: 195.242.102.132
        username: schulprojekt
        password: ${{ secrets.ftp_password }}
        local-dir: schule5.itcoach-wehofer.de/
        server-dir: schule5.itcoach-wehofer.de/
        exclude: |
          **/.git*/**
          **/.claude/**

    - name: Deploy httpdocs
      uses: SamKirkland/FTP-Deploy-Action@v4.3.6
      continue-on-error: true
      with:
        server: 195.242.102.132
        username: schulprojekt
        password: ${{ secrets.ftp_password }}
        local-dir: httpdocs/
        server-dir: httpdocs/
