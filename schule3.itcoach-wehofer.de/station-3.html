<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Station 3 — Altes Labor</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

<div id="station-ui">
  <span class="station-label">STATION 03</span>
  <span class="station-title">ALTES LABOR</span>
  <span class="station-label" id="step-counter"></span>
</div>

<div id="scan-prompt">▸ OBJEKT SCANNEN</div>

<a-scene
  mindar-image="imageTargetSrc: assets/targets/station3.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
  color-space="sRGB" renderer="colorManagement: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0" look-controls="enabled: false">
    <a-cursor fuse="false" rayOrigin="mouse"
              raycaster="objects: .clickable"
              material="color: #cc3300; opacity: 0.8"
              geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015">
    </a-cursor>
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0" id="ar-anchor">

    <!-- PLATZHALTER: Auge / Spiegel-Figur -->
    <a-entity id="eye-figure" class="clickable" position="0 0.05 0">
      <a-torus color="#1a0033" radius="0.06" radius-tubular="0.02" opacity="0.9"
               animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-torus>
      <a-sphere color="#cc3300" radius="0.03" position="0 0 0.01" opacity="0.9"
                animation="property: scale; to: 0.7 0.7 0.7; dir: alternate; loop: true; dur: 1500">
      </a-sphere>
      <a-sphere color="#000" radius="0.015" position="0 0 0.04"></a-sphere>
      <a-torus color="#cc3300" radius="0.065" radius-tubular="0.003" opacity="0.4"
               animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; loop: true; dur: 2000">
      </a-torus>

      <!-- Gespiegelter Text (erscheint nach Tap, scaleX -1) -->
      <a-entity id="mirror-text" visible="false" position="0 0.16 0" scale="-1 1 1">
        <a-plane width="0.34" height="0.08" color="#0a0a0a" opacity="0.9"></a-plane>
        <a-text value="SPIEGEL" align="center" color="#cc3300" width="0.6"
                position="0 0 0.001" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt">
        </a-text>
      </a-entity>
    </a-entity>

  </a-entity>
</a-scene>

<!--
  HINWEIS FÜR LEHRER:
  Rätsel: Auf Requisit 3 (Beweismittel-Etikett) steht eine Frage in Spiegelschrift:
  "WIE VIELE BEINE HAT EINE SPINNE?" → Antwort 8.
  Lesbar mit einem Handspiegel oder indem man das Blatt gegen das Fenster hält
  und von hinten liest. Einen Handspiegel an der Station bereitlegen.
  Antwort 8 → danach gibt es das Code-Fragment STATIONS['station-3'].code (js/interactions.js).
-->

<script src="js/interactions.js"></script>
<script>
  let tapped = false;

  document.addEventListener('DOMContentLoaded', async () => {
    await enableMotion();
    initStepCounter();
  });

  // Tap auf das Auge → Hinweis auf das gespiegelte Etikett
  document.querySelector('#eye-figure').addEventListener('click', () => {
    if (tapped) return;
    tapped = true;
    document.querySelector('#mirror-text').setAttribute('visible', true);

    setTimeout(() => {
      showHint(
        '<span style="color:#cc3300">// DAS AUGE ÖFFNET SICH</span><br><br>' +
        'Morava hat in diesem Raum ein <strong>Beweismittel-Etikett</strong> versteckt.<br><br>' +
        'Die Frage darauf ist <strong style="color:#cc3300">gespiegelt</strong> geschrieben.<br>' +
        'Findet einen Weg, sie zu lesen — und beantwortet sie.',
        () => enableAnswerButton('▸ [ ANTWORT EINGEBEN ]', askAnswer)
      );
    }, 400);
  });

  function askAnswer() {
    askDigit(
      'Wie lautet die Antwort auf die <strong style="color:#cc3300">gespiegelte Frage</strong>?',
      '8', // Antwort auf die gespiegelte Frage (Spinne)
      () => showDigit('station-3', '✓ <span style="color:#cc3300">BOTSCHAFT ENTSCHLÜSSELT</span>')
    );
  }
</script>
</body>
</html>
