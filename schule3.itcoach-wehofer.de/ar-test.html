<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Test — Station 1</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin:0; padding:0; }
    body { overflow: hidden; }
    #ui {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 999;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 1rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      font-family: 'Courier New', monospace;
    }
    #ui span { color: #7b00ff; font-size: 0.65rem; letter-spacing: 0.2em; }
    #back {
      background: none; border: 1px solid #7b00ff55; color: #7b00ff;
      font-family: 'Courier New', monospace; font-size: 0.65rem;
      padding: 0.3rem 0.8rem; cursor: pointer;
    }
    #hint {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      color: #c0c0c0; font-family: 'Courier New', monospace; font-size: 0.75rem;
      letter-spacing: 0.1em; z-index: 999; text-align: center; width: 90%;
      background: rgba(0,0,0,0.55); padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>

<div id="ui">
  <span>// STATION 01 TEST</span>
  <button id="back" onclick="window.history.back()">← ZURÜCK</button>
</div>

<a-scene
  mindar-image="imageTargetSrc: assets/targets/station1.mind; autoStart: true; uiLoading: yes; uiError: yes; uiScanning: yes;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="model" src="assets/models/private_detectiv.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model src="#model"
      position="0 0.15 0" scale="0.3 0.3 0.3"
      animation__idle="property: position; to: 0 0.18 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
    </a-gltf-model>
  </a-entity>

</a-scene>

<div id="hint">▸ Kamera auf Morava-Foto richten</div>

</body>
</html>
