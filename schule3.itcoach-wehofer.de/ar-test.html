<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Diagnose</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#111; font-family:'Courier New',monospace; color:#c0c0c0; min-height:100vh; }
    #menu {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; min-height:100vh; gap:1rem; padding:2rem;
    }
    .title { color:#7b00ff; font-size:0.65rem; letter-spacing:0.3em; margin-bottom:0.5rem; }
    .btn {
      border:1px solid #7b00ff; background:none; color:#7b00ff;
      font-family:inherit; font-size:0.8rem; letter-spacing:0.1em;
      padding:0.8rem 1.5rem; cursor:pointer; width:100%; max-width:300px; text-align:left;
    }
    .btn span { color:#555; font-size:0.65rem; display:block; margin-top:0.2rem; }
    .btn:active { background:#7b00ff22; }
    #back { background:none; border:none; color:#444; font-family:inherit;
            font-size:0.7rem; cursor:pointer; margin-top:1rem; }
  </style>
</head>
<body>
<div id="menu">
  <div class="title">// AR DIAGNOSE</div>

  <button class="btn" onclick="loadTest('aframe')">
    [ 1 ] A-FRAME TEST
    <span>Einfache 3D-Scene ohne Kamera</span>
  </button>

  <button class="btn" onclick="loadTest('camera')">
    [ 2 ] KAMERA + A-FRAME
    <span>Kamera-Hintergrund ohne AR-Tracking</span>
  </button>

  <button class="btn" onclick="loadTest('mindar')">
    [ 3 ] MINDAR VOLLTEST
    <span>Kamera + Bilderkennung + 3D-Figur</span>
  </button>

  <button id="back" onclick="window.history.back()">← Zurück zur Hauptseite</button>
</div>

<script>
  function loadTest(type) {
    if (type === 'aframe') {
      document.open();
      document.write(`<!DOCTYPE html><html><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"><\/script>
        <style>body{margin:0;background:#000;}</style>
      </head><body>
        <div style="position:fixed;top:1rem;left:1rem;z-index:999;font-family:monospace;color:#7b00ff;font-size:0.7rem">
          A-FRAME TEST — siehst du einen blauen Würfel?
        </div>
        <button onclick="history.back()" style="position:fixed;top:0.5rem;right:0.5rem;z-index:999;background:none;border:1px solid #7b00ff44;color:#7b00ff;font-family:monospace;font-size:0.65rem;padding:0.3rem 0.7rem;cursor:pointer">← ZURÜCK</button>
        <a-scene background="color:#000">
          <a-box position="0 1.5 -3" rotation="0 45 0" color="#7b00ff"
                 animation="property:rotation;to:0 405 0;loop:true;dur:3000;easing:linear"></a-box>
          <a-light type="ambient" color="#fff" intensity="0.8"></a-light>
        </a-scene>
      </body></html>`);
      document.close();
    }

    else if (type === 'camera') {
      document.open();
      document.write(`<!DOCTYPE html><html><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
        <script src="https://aframe.io/releases/1.4.2/aframe.min.js"><\/script>
        <style>*{margin:0;padding:0;}body{overflow:hidden;background:#000;}</style>
      </head><body>
        <div style="position:fixed;top:1rem;left:1rem;z-index:999;font-family:monospace;color:#7b00ff;font-size:0.7rem;background:rgba(0,0,0,0.6);padding:0.4rem 0.7rem;">
          KAMERA TEST — siehst du die Kamera?
        </div>
        <button onclick="history.back()" style="position:fixed;top:0.5rem;right:0.5rem;z-index:999;background:none;border:1px solid #7b00ff44;color:#7b00ff;font-family:monospace;font-size:0.65rem;padding:0.3rem 0.7rem;cursor:pointer">← ZURÜCK</button>
        <a-scene>
          <a-camera look-controls="enabled:false"></a-camera>
        </a-scene>
      </body></html>`);
      document.close();
    }

    else if (type === 'mindar') {
      document.open();
      document.write(`<!DOCTYPE html><html><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"><\/script>
        <style>*{margin:0;padding:0;}body{overflow:hidden;background:#000;}</style>
      </head><body>
        <div style="position:fixed;top:1rem;left:1rem;z-index:999;font-family:monospace;color:#7b00ff;font-size:0.7rem;background:rgba(0,0,0,0.6);padding:0.4rem 0.7rem;">
          MINDAR — Kamera auf Morava-Foto richten
        </div>
        <button onclick="history.back()" style="position:fixed;top:0.5rem;right:0.5rem;z-index:999;background:none;border:1px solid #7b00ff44;color:#7b00ff;font-family:monospace;font-size:0.65rem;padding:0.3rem 0.7rem;cursor:pointer">← ZURÜCK</button>
        <a-scene
          mindar-image="imageTargetSrc: assets/targets/station1.mind; autoStart:true; uiLoading:no; uiError:no; uiScanning:no;"
          color-space="sRGB" renderer="colorManagement:true"
          vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
          <a-assets><a-asset-item id="m" src="assets/models/private_detectiv.glb"></a-asset-item></a-assets>
          <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
          <a-entity mindar-image-target="targetIndex:0">
            <a-gltf-model src="#m" position="0 0.15 0" scale="0.3 0.3 0.3"></a-gltf-model>
          </a-entity>
        </a-scene>
      </body></html>`);
      document.close();
    }
  }
</script>
</body>
</html>
