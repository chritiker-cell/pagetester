<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Kamera Test</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }

    #start-screen {
      position: fixed; inset: 0; background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1.5rem; z-index: 9999; padding: 2rem;
    }
    #start-screen .title { color: #7b00ff; font-size: 0.65rem; letter-spacing: 0.3em; }
    #start-btn {
      border: 1px solid #7b00ff; background: none; color: #7b00ff;
      font-family: 'Courier New', monospace; font-size: 0.9rem;
      padding: 0.9rem 2rem; cursor: pointer; letter-spacing: 0.15em;
      width: 100%; max-width: 280px;
    }
    #start-btn:active { background: #7b00ff22; }
    #back-btn-start {
      background: none; border: none; color: #444;
      font-family: 'Courier New', monospace; font-size: 0.7rem;
      cursor: pointer; letter-spacing: 0.1em;
    }

    #ui {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 999;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.75rem 1rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    }
    #ui span { color: #7b00ff; font-size: 0.65rem; letter-spacing: 0.2em; }
    #back-btn {
      background: none; border: 1px solid #7b00ff44; color: #7b00ff;
      font-family: 'Courier New', monospace; font-size: 0.65rem;
      padding: 0.3rem 0.75rem; cursor: pointer;
    }
    #status {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      color: #c0c0c0; font-size: 0.75rem; letter-spacing: 0.1em;
      z-index: 999; text-align: center; width: 90%;
      background: rgba(0,0,0,0.6); padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>

<!-- Start Screen -->
<div id="start-screen">
  <div class="title">// AR KAMERA TEST</div>
  <button id="start-btn" onclick="startAR()">[ KAMERA STARTEN ]</button>
  <button id="back-btn-start" onclick="window.history.back()">← Zurück</button>
</div>

<!-- AR UI (versteckt bis Start) -->
<div id="ui" style="display:none">
  <span>// AR AKTIV</span>
  <button id="back-btn" onclick="window.history.back()">← ZURÜCK</button>
</div>

<a-scene id="ar-scene" style="display:none"
  mindar-image="imageTargetSrc: assets/targets/station1.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="detektiv-model" src="assets/models/private_detectiv.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-gltf-model src="#detektiv-model"
      position="0 0.15 0"
      scale="0.3 0.3 0.3"
      animation__idle="property: position; to: 0 0.18 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
    </a-gltf-model>
  </a-entity>

</a-scene>

<div id="status" style="display:none">▸ LÄDT ...</div>

<script>
  async function startAR() {
    const btn = document.getElementById('start-btn');
    btn.textContent = '[ WIRD GESTARTET ... ]';
    btn.disabled = true;

    // Erst Kamera-Permission manuell anfordern
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      stream.getTracks().forEach(t => t.stop()); // sofort stoppen, MindAR übernimmt
    } catch(e) {
      btn.textContent = '[ KAMERA VERWEIGERT ]';
      btn.style.color = '#c00';
      btn.style.borderColor = '#c00';
      const el = document.createElement('div');
      el.style.cssText = 'color:#c00;font-size:0.75rem;text-align:center;max-width:280px';
      el.textContent = '⚠ Kamera-Zugriff verweigert. Bitte in den Browser-Einstellungen erlauben.';
      btn.parentNode.insertBefore(el, btn.nextSibling);
      return;
    }

    // Screens tauschen
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('ar-scene').style.display = '';
    document.getElementById('ui').style.display = '';
    document.getElementById('status').style.display = '';

    const scene = document.getElementById('ar-scene');
    scene.addEventListener('arReady', () => {
      document.getElementById('status').textContent = '✓ KAMERA AKTIV — Morava-Foto scannen';
    });
    scene.addEventListener('arError', (e) => {
      document.getElementById('status').textContent = '⚠ ' + (e.detail?.message || 'AR Fehler');
    });

    // MindAR starten
    scene.addEventListener('loaded', () => {
      const arSystem = scene.systems['mindar-image-system'];
      if (arSystem) arSystem.start();
    });
  }
</script>
</body>
</html>
