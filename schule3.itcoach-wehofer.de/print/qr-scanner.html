<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-Code Scanner – Schattenschule</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #444; font-family: 'Courier New', monospace; color: #111; }
    .page {
      width: 210mm; height: 297mm; margin: 10mm auto; background: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20mm; text-align: center; gap: 9mm;
    }
    h1 { font-size: 26pt; letter-spacing: 0.15em; }
    .sub { font-size: 12pt; letter-spacing: 0.25em; color: #555; margin-top: -5mm; }
    #qr { padding: 6mm; border: 0.6mm solid #111; }
    #qr img, #qr canvas { display: block; width: 110mm !important; height: 110mm !important; image-rendering: pixelated; }
    .steps { font-size: 13pt; line-height: 1.7; text-align: left; }
    .url { font-size: 10pt; color: #666; word-break: break-all; }
    .btn { position: fixed; top: 12px; right: 12px; padding: 10px 18px; font: inherit; cursor: pointer; }
    @media print {
      body { background: #fff; }
      .page { margin: 0; }
      .btn { display: none; }
    }
  </style>
</head>
<body>
  <button class="btn" onclick="window.print()">🖨 Drucken</button>
  <div class="page">
    <h1>∅ SCHATTENSCHULE</h1>
    <p class="sub">SCHATTENWELT-SCANNER</p>
    <div id="qr"></div>
    <ol class="steps">
      <li>QR-Code mit der Handy-Kamera scannen</li>
      <li>Kamera-Zugriff erlauben</li>
      <li>Handy auf ein Motiv der Station richten</li>
    </ol>
    <p class="url" id="url"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // Adresse des Scanners – bei Umzug der Website nur hier ändern
    const SCANNER_URL = 'https://schule3.itcoach-wehofer.de/scan.html';
    document.getElementById('url').textContent = SCANNER_URL;
    new QRCode(document.getElementById('qr'), {
      text: SCANNER_URL, width: 512, height: 512,
      colorDark: '#000000', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
