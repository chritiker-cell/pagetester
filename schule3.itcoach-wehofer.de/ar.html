<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Test — Schattenschule</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body style="margin:0;overflow:hidden;background:#000;">

  <a href="index.html" style="position:fixed;top:1rem;right:1rem;z-index:10000;
    background:rgba(0,0,0,0.8);border:1px solid #7b00ff44;color:#7b00ff;
    font-family:'Courier New',monospace;font-size:0.75rem;padding:0.5rem 1rem;
    text-decoration:none;display:block;">← ZURÜCK</a>

  <a-scene
    mindar-image="imageTargetSrc: assets/targets/station1.mind; autoStart: true; uiLoading: yes; uiError: yes; uiScanning: yes;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-box color="#7b00ff" position="0 0.15 0" scale="0.2 0.2 0.2"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear">
      </a-box>
    </a-entity>

  </a-scene>

</body>
</html>
