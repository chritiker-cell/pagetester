<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Test — Schattenschule</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body style="margin:0;overflow:hidden;background:#1a0033;">

  <a href="index.html" style="position:fixed;top:1rem;right:1rem;z-index:10000;
    background:rgba(0,0,0,0.8);border:1px solid #7b00ff44;color:#7b00ff;
    font-family:'Courier New',monospace;font-size:0.75rem;padding:0.5rem 1rem;
    text-decoration:none;display:block;">← ZURÜCK</a>

  <div id="status" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#7b00ff;font-family:'Courier New',monospace;font-size:0.9rem;
    text-align:center;z-index:999;pointer-events:none;line-height:1.8;">
    A-Frame lädt...
  </div>

  <a-scene id="scene" vr-mode-ui="enabled: false">
    <a-sky color="#1a1a2e"></a-sky>
    <a-entity position="0 0 -3">
      <a-box color="#7b00ff" scale="0.5 0.5 0.5"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 2000; easing: linear">
      </a-box>
    </a-entity>
    <a-camera></a-camera>
  </a-scene>

  <script>
    window.onerror = function(msg, src, line) {
      document.getElementById('status').style.color = '#ff4444';
      document.getElementById('status').innerHTML = 'JS FEHLER:<br>' + msg + '<br>Zeile ' + line;
    };
    document.getElementById('scene').addEventListener('loaded', function() {
      document.getElementById('status').style.color = '#39ff14';
      document.getElementById('status').textContent = 'A-Frame OK ✓';
      setTimeout(() => { document.getElementById('status').style.display = 'none'; }, 2000);
    });
  </script>

</body>
</html>
