
<!DOCTYPE html>

<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sight Reading Trainer - Vom-Blatt-Spiel</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">
                <span class="logo-icon">&#9835;</span> Sight Reading
            </div>
            <ul class="nav-links">
                <li><a href="#" data-view="home" class="active">Start</a></li>
                <li><a href="#" data-view="practice">Training</a></li>
            </ul>
        </div>
    </nav>

    <!-- Start View -->
    <div id="view-home" class="view active">
        <div class="hero">
            <div class="hero-icon">&#9835;</div>
            <h1>Sight Reading Trainer</h1>
            <p>Uebe Vom-Blatt-Spiel mit zufaellig generierten Musikstuecken</p>
        </div>

        <div class="content">
            <section class="settings-section">
                <h2>Einstellungen</h2>

                <!-- Level Selection -->
                <div class="setting-group">
                    <h3>Schwierigkeitsstufe</h3>
                    <div class="option-buttons" id="level-buttons">
                        <button class="option-btn active" data-level="beginner">
                            <span class="option-title">Anfaenger</span>
                            <span class="option-desc">Eine Hand, einfache Noten</span>
                        </button>
                        <button class="option-btn" data-level="intermediate">
                            <span class="option-title">Fortgeschritten</span>
                            <span class="option-desc">Beide Haende, Akkorde</span>
                        </button>
                        <button class="option-btn" data-level="expert">
                            <span class="option-title">Experte</span>
                            <span class="option-desc">Komplex, Polyrhythmen</span>
                        </button>
                    </div>
                </div>

                <!-- Key Difficulty -->
                <div class="setting-group">
                    <h3>Tonart-Schwierigkeit</h3>
                    <div class="option-buttons" id="key-difficulty-buttons">
                        <button class="option-btn active" data-key-difficulty="easy">
                            <span class="option-title">Einfach</span>
                            <span class="option-desc">C, D, E, F, G-Dur (0-2 Vorzeichen)</span>
                        </button>
                        <button class="option-btn" data-key-difficulty="hard">
                            <span class="option-title">Schwer</span>
                            <span class="option-desc">Alle Tonarten</span>
                        </button>
                    </div>
                </div>

                <!-- Time Signature -->
                <div class="setting-group">
                    <h3>Taktart</h3>
                    <div class="option-buttons small" id="time-sig-buttons">
                        <button class="option-btn active" data-time-sig="4/4">4/4</button>
                        <button class="option-btn" data-time-sig="3/4">3/4</button>
                        <button class="option-btn" data-time-sig="2/4">2/4</button>
                    </div>
                </div>

                <!-- Measure Count -->
                <div class="setting-group">
                    <h3>Anzahl Takte: <span id="measure-count-display">8</span></h3>
                    <div class="slider-container">
                        <input type="range" id="measure-count" min="8" max="12" value="8" class="slider">
                        <div class="slider-labels">
                            <span>8</span>
                            <span>10</span>
                            <span>12</span>
                        </div>
                    </div>
                </div>

                <div class="start-section">
                    <button id="generate-piece" class="btn-primary btn-large">Neues Stueck generieren</button>
                </div>
            </section>
        </div>
    </div>

    <!-- Practice View -->
    <div id="view-practice" class="view">
        <div class="practice-container">
            <div class="practice-header">
                <div class="practice-info">
                    <span class="info-badge" id="current-level">Anfaenger</span>
                    <span class="info-badge" id="current-key">C-Dur</span>
                    <span class="info-badge" id="current-time-sig">4/4</span>
                </div>
                <button id="back-to-home" class="btn-secondary">Zurueck</button>
            </div>

            <div class="notation-wrapper">
                <div id="notation-display"></div>
            </div>

            <div class="playback-controls">
                <div class="tempo-control">
                    <label for="tempo-slider">Tempo: <span id="tempo-display">80</span> BPM</label>
                    <input type="range" id="tempo-slider" min="40" max="160" value="80" class="slider">
                </div>
                <div class="transport-buttons">
                    <button id="btn-play" class="transport-btn" title="Abspielen">
                        <span class="play-icon">&#9654;</span>
                    </button>
                    <button id="btn-stop" class="transport-btn" title="Stopp">
                        <span class="stop-icon">&#9632;</span>
                    </button>
                    <button id="btn-loop" class="transport-btn" title="Loop">
                        <span class="loop-icon">&#8634;</span>
                    </button>
                </div>
                <button id="new-piece" class="btn-primary">Neues Stueck</button>
            </div>
        </div>
    </div>

    <footer>
        <p>Sight Reading Trainer - schule3.itcoach-wehofer.de</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/notation.js"></script>
    <script src="js/playback.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
